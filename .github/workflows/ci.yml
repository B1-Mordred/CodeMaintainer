name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.25.0
          cache: true
      - name: Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Go tests
        run: go test -race ./...
      - name: Go static analysis
        run: go vet ./...
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend tests and build
        working-directory: web
        run: npm ci && npm test && npm run build && npx redocly lint ../internal/api/openapi.yaml
      - name: Validate Compose
        run: mkdir -p .data .cache/go .cache/npm && docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Build control plane images
        run: docker compose -f compose.yaml -f compose.dev.yaml build controller maintainctl
