    parameters:
      - { name: profileID, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_.-]{0,63}$" } }
    post:
      summary: Run the bounded smoke benchmark for an allow-listed model profile
      operationId: benchmarkModel
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Benchmark result, content: { application/json: { schema: { $ref: "#/components/schemas/ModelBenchmark" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /models/{profileID}/actions/load:
    parameters:
      - { name: profileID, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_.-]{0,63}$" } }
    post:
      summary: Load one allow-listed model profile, unloading the previous model first
      operationId: loadModel
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Loaded model status, content: { application/json: { schema: { $ref: "#/components/schemas/ModelStatus" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /models/actions/unload:
    post:
      summary: Unload the currently resident allow-listed model
      operationId: unloadModel
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Unloaded model status, content: { application/json: { schema: { $ref: "#/components/schemas/ModelStatus" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /config:
    get:
      summary: Get the current validated configuration
      operationId: getConfig
      responses:
        "200":
          description: Current validated configuration and revision metadata
          content:
            application/json:
              schema:
                type: object
                required: [revision, document]
                properties:
                  revision: { $ref: "#/components/schemas/ConfigRevision" }
                  document: { $ref: "#/components/schemas/SystemConfig" }
        default: { $ref: "#/components/responses/ErrorResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /config/validate:
    post:
      summary: Validate a proposed configuration without saving it
      operationId: validateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigDocumentRequest" }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /config/revisions:
    get:
      summary: List configuration revision history
      operationId: listConfigRevisions
      responses:
        "200":
          description: Newest-first configuration revisions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ConfigRevision" } }
        default: { $ref: "#/components/responses/ErrorResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Validate and save a configuration revision
      operationId: createConfigRevision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigDocumentRequest" }
      responses:
        "201":
          description: Created configuration revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRevision" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /config/revisions/{revisionID}/rollback:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      summary: Create a new revision matching a selected rollback point
      operationId: rollbackConfigRevision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: Created rollback revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRevision" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /config/descriptors:
    get:
      summary: Search trusted typed configuration descriptors and UI metadata
      operationId: listConfigDescriptors
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 256 } }
        - { name: advanced, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Stable controller-owned descriptor inventory
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, items]
                properties:
                  schema_version: { type: integer, const: 1 }
                  items: { type: array, items: { $ref: "#/components/schemas/ConfigDescriptor" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /config/values:
    get:
      summary: Read configured values and optimistic version at one mutable scope
      operationId: getConfigScope
      parameters:
        - { $ref: "#/components/parameters/ConfigScopeKind" }
        - { $ref: "#/components/parameters/ConfigScopeID" }
      responses:
        "200":
          description: Redacted scope state; ETag identifies its current version
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ConfigScopeState" } } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /config/effective:
    post:
      summary: Resolve typed effective values and provenance across selected scopes
      operationId: resolveEffectiveConfig
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scopes]
              properties: { scopes: { type: array, maxItems: 6, items: { $ref: "#/components/schemas/ConfigScopeRef" } } }
      responses:
        "200": { description: Complete effective configuration, content: { application/json: { schema: { $ref: "#/components/schemas/EffectiveConfiguration" } } } }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /config/export:
    get:
      summary: Export a deterministic redacted declarative scope document
      operationId: exportConfigScope
      parameters:
        - { $ref: "#/components/parameters/ConfigScopeKind" }
        - { $ref: "#/components/parameters/ConfigScopeID" }
      responses:
        "200": { description: Hash-bound redacted export, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/DeclarativeConfig" } } } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /config/import/preview:
    post:
      summary: Validate and preview a controlled declarative import without saving it
      operationId: previewConfigImport
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigImportRequest" } } } }
      responses:
        "200": { description: Import preview including never-applied unknown keys, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigImportPreview" } } } }
        "428": { $ref: "#/components/responses/ErrorResponse" }
  /config/import:
    post:
      summary: Create a reviewed-before-apply import draft from a validated document
      operationId: importConfigDraft
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigImportRequest" } } } }
      responses:
        "201": { description: Import draft and exact preview, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { type: object, required: [draft, preview], properties: { draft: { $ref: "#/components/schemas/ConfigDraft" }, preview: { $ref: "#/components/schemas/ConfigImportPreview" } } } } } }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "428": { $ref: "#/components/responses/ErrorResponse" }
  /config/prerequisites:
    get:
      summary: List registered external prerequisites and their evaluation behavior
      operationId: listConfigPrerequisites
      responses:
        "200":
          description: Prerequisite registry; version-bound results are recorded on drafts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, prerequisite, status, message]
                      properties:
                        key: { type: string }
                        prerequisite: { type: string }
                        status: { type: string, enum: [passed, failed, unavailable] }
                        message: { type: string }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /config/drafts:
    get:
      summary: List versioned configuration drafts at one scope
      operationId: listConfigDrafts
      parameters:
        - { $ref: "#/components/parameters/ConfigScopeKind" }
        - { $ref: "#/components/parameters/ConfigScopeID" }
      responses:
        "200": { description: Configuration drafts, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ConfigDraft" } } } } } } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Save a typed configuration draft against an exact scope version
      operationId: createConfigDraft
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigDraftCreateRequest" } } } }
      responses:
        "201": { description: Validated draft, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigDraftResult" } } } }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "428": { $ref: "#/components/responses/ErrorResponse" }
  /config/drafts/{draftID}:
    parameters: [{ $ref: "#/components/parameters/ConfigDraftID" }]
    get:
      summary: Read one redacted configuration draft
      operationId: getConfigDraft
      responses:
        "200": { description: Configuration draft, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigDraft" } } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    put:
      summary: Replace an open draft using optimistic concurrency
      operationId: updateConfigDraft
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigDraftUpdateRequest" } } } }
      responses:
        "200": { description: Updated validated draft, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigDraftResult" } } } }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "428": { $ref: "#/components/responses/ErrorResponse" }
  /config/drafts/{draftID}/checks:
    parameters: [{ $ref: "#/components/parameters/ConfigDraftID" }]
    get:
      summary: List append-only validation, dry-run, and prerequisite evidence
      operationId: listConfigDraftChecks
      responses:
        "200": { description: Configuration checks, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ConfigCheckResult" } } } } } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /config/drafts/{draftID}/actions/validate:
    parameters: [{ $ref: "#/components/parameters/ConfigDraftID" }]
    post:
      summary: Validate the exact current draft without applying it
      operationId: validateConfigDraft
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Validation report and append-only check, content: { application/json: { schema: { type: object, required: [validation, check], properties: { validation: { $ref: "#/components/schemas/ConfigValidationReport" }, check: { $ref: "#/components/schemas/ConfigCheckResult" } } } } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /config/drafts/{draftID}/actions/dry-run:
    parameters: [{ $ref: "#/components/parameters/ConfigDraftID" }]
    post:
      summary: Run registered validation and side-effect-free prerequisite checks
      operationId: dryRunConfigDraft
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Append-only dry-run results, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ConfigCheckResult" } } } } } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /config/drafts/{draftID}/actions/review:
    parameters: [{ $ref: "#/components/parameters/ConfigDraftID" }]
    post:
      summary: Bind review approval to the exact validated draft version
      operationId: reviewConfigDraft
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigReasonRequest" } } } }
      responses:
        "200": { description: Reviewed draft, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigDraftResult" } } } }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "428": { $ref: "#/components/responses/ErrorResponse" }
  /config/drafts/{draftID}/actions/apply:
    parameters: [{ $ref: "#/components/parameters/ConfigDraftID" }]
    post:
      summary: Atomically apply the exact reviewed draft
      operationId: applyConfigDraft
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigReasonRequest" } } } }
      responses:
        "201": { description: Applied revision and new scope state, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { type: object, required: [revision, scope, validation], properties: { revision: { $ref: "#/components/schemas/ConfigRegistryRevision" }, scope: { $ref: "#/components/schemas/ConfigScopeState" }, validation: { $ref: "#/components/schemas/ConfigValidationReport" } } } } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "428": { $ref: "#/components/responses/ErrorResponse" }
  /config/drafts/{draftID}/actions/discard:
    parameters: [{ $ref: "#/components/parameters/ConfigDraftID" }]
    post:
      summary: Discard an open or reviewed draft without changing effective values
      operationId: discardConfigDraft
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigReasonRequest" } } } }
      responses:
        "200": { description: Discarded draft, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigDraft" } } } }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "428": { $ref: "#/components/responses/ErrorResponse" }
  /config/registry-revisions:
    get:
      summary: List immutable scoped configuration revision history
      operationId: listConfigRegistryRevisions
      parameters:
        - { $ref: "#/components/parameters/ConfigScopeKind" }
        - { $ref: "#/components/parameters/ConfigScopeID" }
      responses:
        "200": { description: Scoped revisions, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ConfigRegistryRevision" } } } } } } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /config/registry-revisions/{revisionID}/actions/rollback:
    parameters: [{ $ref: "#/components/parameters/ConfigRegistryRevisionID" }]
    post:
      summary: Create a new scoped revision restoring an exact historical state
      operationId: rollbackConfigRegistryRevision
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigReasonRequest" } } } }
      responses:
        "201": { description: Rollback revision and resulting scope, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { type: object, required: [revision, scope], properties: { revision: { $ref: "#/components/schemas/ConfigRegistryRevision" }, scope: { $ref: "#/components/schemas/ConfigScopeState" } } } } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "428": { $ref: "#/components/responses/ErrorResponse" }
  /audit:
    get:
      summary: List append-only audit events
      operationId: listAuditEvents
      responses:
        "200":
          description: Bounded append-only audit page
          content: { application/json: { schema: { type: object } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: maintainer_session
    hermesBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  parameters:
    JobID:
      name: jobID
      in: path
      required: true
      schema: { type: string, pattern: "^job_[0-9a-f]{32}$" }
    RevisionID:
      name: revisionID
      in: path
      required: true
      schema: { type: string, pattern: "^config_[0-9a-f]{32}$" }
    ArtifactID:
      name: artifactID
      in: path
      required: true
      schema: { type: string, pattern: "^artifact_[0-9a-f]{32}$" }
    ProjectID:
      name: projectID
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
    MemoryID:
      name: memoryID
      in: path
      required: true
      schema: { type: string, pattern: "^memory_[0-9a-f]{32}$" }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 256 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"config-(scope|draft)-[0-9]+"$' }
    ConfigScopeKind:
      name: scope_kind
      in: query
      required: true
      schema: { $ref: "#/components/schemas/ConfigScopeKind" }
    ConfigScopeID:
      name: scope_id
      in: query
      required: false
      schema: { type: string, maxLength: 256 }
    ConfigDraftID:
      name: draftID
      in: path
      required: true
      schema: { type: string, pattern: "^configdraft_[0-9a-f]{32}$" }
    ConfigRegistryRevisionID:
      name: revisionID
      in: path
      required: true
      schema: { type: string, pattern: "^configreg_[0-9a-f]{32}$|^config_registry_system_v16$" }
  responses:
    ErrorResponse:
      description: Structured error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    User:
      type: object
      required: [id, username, display_name, role, disabled, created_at, updated_at]
      properties:
        id: { type: string, pattern: "^user_[0-9a-f]{32}$" }
        username: { type: string, minLength: 3, maxLength: 64, pattern: "^[a-z0-9._-]+$" }
        display_name: { type: string, minLength: 1, maxLength: 128 }
        role: { type: string, enum: [viewer, operator, reviewer, administrator] }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, display_name, password, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$" }
        display_name: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 14, maxLength: 1024, writeOnly: true }
        role: { type: string, enum: [viewer, operator, reviewer, administrator] }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [display_name, role, disabled]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 128 }
        role: { type: string, enum: [viewer, operator, reviewer, administrator] }
        disabled: { type: boolean }
    BackupRecord:
      type: object
      additionalProperties: false
      required: [id, created_at, bytes, sha256, encrypted]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        bytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        encrypted: { type: boolean }
    BackupRestoreReport:
      type: object
      additionalProperties: false
      required: [id, dry_run, compatible, schema_version, files, bytes, checksums_valid, excluded]
      properties:
        id: { type: string }
        dry_run: { type: boolean }
        compatible: { type: boolean }
        schema_version: { type: integer }
        files: { type: integer, minimum: 1 }
        bytes: { type: integer, minimum: 1 }
        checksums_valid: { type: boolean }
        excluded: { type: array, items: { type: string } }
    BackupRestoreResult:
      type: object
      additionalProperties: false
      required: [report, staged, requires_restart]
      properties:
        report: { $ref: "#/components/schemas/BackupRestoreReport" }
        staged: { type: boolean, const: true }
        requires_restart: { type: boolean, const: true }
    Principal:
      type: object
      required: [user, expires_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        expires_at: { type: string, format: date-time }
        reauthenticated_until: { type: string, format: date-time }
    AuthenticationResult:
      type: object
      required: [principal, csrf_token]
      properties:
        principal: { $ref: "#/components/schemas/Principal" }
        csrf_token: { type: string, minLength: 32, maxLength: 256, writeOnly: true }
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [username, display_name, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$" }
        display_name: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 14, maxLength: 1024, writeOnly: true }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 14, maxLength: 1024, writeOnly: true }
    UpsertProjectRequest:
      type: object
      additionalProperties: false
      required: [id, provider, repository, default_branch]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        provider: { type: string, enum: [local, github] }
        repository: { type: string, pattern: "^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$", maxLength: 201 }
        default_branch: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        local_remote_name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\\.git$" }
    Project:
      allOf:
        - { $ref: "#/components/schemas/UpsertProjectRequest" }
        - type: object
          required: [enabled, created_at, updated_at]
          properties:
            enabled: { type: boolean }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    RepositorySyncResult:
      type: object
      additionalProperties: false
      required: [project_id, base_sha]
      properties:
        project_id: { type: string }
        base_sha: { type: string, pattern: "^[a-f0-9]{40}$" }
    MemoryStatus:
      type: string
      enum: [quarantine, canonical, stale, deleted]
    MemoryScope:
      type: object
      required: [owner, repository]
      properties:
        owner: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        repository: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
    MemoryCandidateRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 65536 }
        kind: { type: string, enum: [project_knowledge, verified_case, failed_case, pattern, known_issue, flaky_test, issue_history] }
        source_uri: { type: string, maxLength: 2048 }
        base_commit: { type: string, pattern: "^[a-fA-F0-9]{40}$" }
        merged_commit: { type: string, pattern: "^[a-fA-F0-9]{40}$" }
        affected_paths: { type: array, maxItems: 1000, items: { type: string, minLength: 1, maxLength: 4096 } }
        invalidation_rule: { type: string, maxLength: 4096 }
        expires_at: { type: string, format: date-time }
    MemoryPromotionRequest:
      type: object
      additionalProperties: false
      required: [rationale, basis, expected_version]
      properties:
        rationale: { type: string, minLength: 1, maxLength: 4096 }
        basis: { type: string, enum: [deterministic_verification, merged_pr, human_approval] }
        merged_commit: { type: string, pattern: "^[a-fA-F0-9]{40}$" }
        expected_version: { type: integer, minimum: 1 }
    MemoryCorrectionRequest:
      type: object
      additionalProperties: false
      required: [content, rationale, expected_version]
      properties:
        content: { type: string, minLength: 1, maxLength: 65536 }
        affected_paths: { type: array, maxItems: 1000, items: { type: string, minLength: 1, maxLength: 4096 } }
        invalidation_rule: { type: string, maxLength: 4096 }
        rationale: { type: string, minLength: 1, maxLength: 4096 }
        expected_version: { type: integer, minimum: 1 }
    MemoryLifecycleRequest:
      type: object
      additionalProperties: false
      required: [rationale, expected_version]
      properties:
        rationale: { type: string, minLength: 1, maxLength: 4096 }
        expected_version: { type: integer, minimum: 1 }
    MemoryRecord:
      type: object
      required: [id, scope, namespace, content, content_hash, source_uri, base_commit, affected_paths, status, verified, secret_scan_pass, kind, version, created_at, updated_at]
      properties:
        id: { type: string, pattern: "^memory_[0-9a-f]{32}$" }
        scope: { $ref: "#/components/schemas/MemoryScope" }
        namespace: { type: string, pattern: "^viking://resources/projects/[^/]+/[^/]+/$" }
        content: { type: string, maxLength: 65536 }
        content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        source_uri: { type: string, maxLength: 2048 }
        base_commit: { type: string, pattern: "^$|^[a-fA-F0-9]{40}$" }
        merged_commit: { type: string, pattern: "^[a-fA-F0-9]{40}$" }
        affected_paths: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/MemoryStatus" }
        verified: { type: boolean }
        secret_scan_pass: { type: boolean }
        kind: { type: string }
        invalidation_rule: { type: string }
        expires_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MemoryEvent:
      type: object
      required: [sequence, record_id, scope, action, actor_id, rationale, details, created_at]
      properties:
        sequence: { type: integer, minimum: 1 }
        record_id: { type: string }
        scope: { $ref: "#/components/schemas/MemoryScope" }
        action: { type: string }
        actor_id: { type: string }
        rationale: { type: string }
        details: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    MemoryExportRecord:
      type: object
      additionalProperties: false
      required: [original_id, content, affected_paths, kind, original_status, original_verified, content_hash]
      properties:
        original_id: { type: string, pattern: "^memory_[0-9a-f]{32}$" }
        content: { type: string, minLength: 1, maxLength: 65536 }
        source_uri: { type: string, maxLength: 2048 }
        base_commit: { type: string, pattern: "^[a-fA-F0-9]{40}$" }
        merged_commit: { type: string, pattern: "^[a-fA-F0-9]{40}$" }
        affected_paths: { type: array, items: { type: string } }
        kind: { type: string }
        invalidation_rule: { type: string, maxLength: 4096 }
        expires_at: { type: string, format: date-time }
        original_status: { $ref: "#/components/schemas/MemoryStatus" }
        original_verified: { type: boolean }
        content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
    MemoryExportBundle:
      type: object
      additionalProperties: false
      required: [schema_version, scope, exported_at, records, manifest_hash]
      properties:
        schema_version: { type: integer, const: 1 }
        scope: { $ref: "#/components/schemas/MemoryScope" }
        exported_at: { type: string, format: date-time }
        records: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/MemoryExportRecord" } }
        manifest_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
    MemoryRestoreRequest:
      type: object
      additionalProperties: false
      required: [dry_run, bundle]
      properties:
        dry_run: { type: boolean }
        bundle: { $ref: "#/components/schemas/MemoryExportBundle" }
    MemoryRestoreReport:
      type: object
      additionalProperties: false
      required: [dry_run, validated, imported, skipped, manifest_hash]
      properties:
