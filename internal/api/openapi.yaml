openapi: 3.1.0
info:
  title: CodeMaintainer Controller API
  version: 0.1.0
  description: Trusted workflow control API. No endpoint accepts arbitrary commands, images, mounts, model paths, or container options.
  license:
    name: Unlicensed foundation build
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8080/api/v1
security:
  - sessionCookie: []
paths:
  /auth/status:
    get:
      security: []
      summary: Report whether one-time administrator bootstrap is complete
      operationId: getAuthenticationStatus
      responses:
        "200":
          description: Authentication bootstrap status
          content:
            application/json:
              schema:
                type: object
                required: [bootstrapped, authentication_enabled]
                properties:
                  bootstrapped: { type: boolean }
                  authentication_enabled: { type: boolean }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /auth/bootstrap:
    post:
      security: []
      summary: Create the one-time local administrator and authenticated session
      operationId: bootstrapAdministrator
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BootstrapRequest" } } }
      responses:
        "201":
          description: Bootstrap administrator session
          headers:
            Set-Cookie: { schema: { type: string } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticationResult" } } }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/login:
    post:
      security: []
      summary: Create a bounded local session
      operationId: login
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        "200":
          description: Authenticated session
          headers:
            Set-Cookie: { schema: { type: string } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticationResult" } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/session:
    get:
      summary: Get the current principal and rotate its CSRF token
      operationId: getAuthenticationSession
      responses:
        "200":
          description: Current principal and fresh CSRF token
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticationResult" } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /auth/reauthenticate:
    post:
      summary: Reauthenticate the current session for a five-minute sensitive-action window
      operationId: reauthenticate
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 14, maxLength: 1024, writeOnly: true }
      responses:
        "200":
          description: Recently reauthenticated principal
          content:
            application/json:
              schema:
                type: object
                required: [principal]
                properties:
                  principal: { $ref: "#/components/schemas/Principal" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/logout:
    post:
      summary: Revoke the current session
      operationId: logout
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Session revoked and cookie expired }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /admin/users:
    get:
      summary: List local users and exact roles
      operationId: listUsers
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Local users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Create a local user after recent administrator reauthentication
      operationId: createUser
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateUserRequest" } } }
      responses:
        "201": { description: Created user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /admin/users/{userID}:
    parameters:
      - { name: userID, in: path, required: true, schema: { type: string, pattern: "^user_[0-9a-f]{32}$" } }
    put:
      summary: Update a local user's display name, exact role, and enabled state
      operationId: updateUser
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateUserRequest" } } }
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /admin/backups:
    get:
      summary: List locally retained checksum-bound backups
      operationId: listBackups
      responses:
        "200":
          description: Backup inventory
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/BackupRecord" } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Create a consistent state backup after recent reauthentication
      operationId: createBackup
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "201": { description: Created backup, content: { application/json: { schema: { $ref: "#/components/schemas/BackupRecord" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /admin/backups/{backupID}/actions/restore:
    parameters:
      - { name: backupID, in: path, required: true, schema: { type: string, pattern: "^backup_[A-Za-z0-9.T:-]+$" } }
    post:
      summary: Validate backup checksums and schema compatibility without replacing live state
      operationId: validateBackupRestore
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dry_run]
              properties:
                dry_run: { type: boolean }
      responses:
        "200": { description: Restore dry-run report, content: { application/json: { schema: { $ref: "#/components/schemas/BackupRestoreReport" } } } }
        "202": { description: Validated restore staged for the next full appliance restart, content: { application/json: { schema: { $ref: "#/components/schemas/BackupRestoreResult" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /admin/update/preflight:
    get:
      summary: Check controller, configuration, database, and backup readiness for an operator update
      operationId: getUpdatePreflight
      responses:
        "200":
          description: Non-mutating update readiness report
          content:
            application/json:
              schema:
                type: object
                required: [ready, version, profile, backup_count, checks]
                properties:
                  ready: { type: boolean }
                  version: { type: string }
                  profile: { type: string }
                  backup_count: { type: integer, minimum: 0 }
                  checks:
                    type: array
                    items:
                      type: object
                      required: [name, status, detail]
                      properties:
                        name: { type: string }
                        status: { type: string, enum: [passed, warning, failed] }
                        detail: { type: string }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /system/status:
    get:
      summary: Get bounded system and component status
      operationId: getSystemStatus
      responses:
        "200":
          description: Current bounded component status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        default: { $ref: "#/components/responses/ErrorResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /github/webhooks:
    post:
      security: []
      summary: Receive a GitHub pull-request webhook and validate its HMAC in the isolated GitHub bridge
      operationId: receiveGitHubWebhook
      parameters:
        - { name: X-GitHub-Delivery, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: X-GitHub-Event, in: header, required: true, schema: { type: string, const: pull_request } }
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string, pattern: "^sha256=[a-f0-9]{64}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Authenticated delivery was atomically applied or recognized as a replay
          content: { application/json: { schema: { $ref: "#/components/schemas/GitHubDeliveryResult" } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /gitlab/webhooks:
    post:
      security: []
      summary: Receive a GitLab merge-request webhook and validate its secret token in the isolated Git bridge
      operationId: receiveGitLabWebhook
      parameters:
        - { name: X-Gitlab-Webhook-UUID, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: X-Gitlab-Event, in: header, required: true, schema: { type: string, const: "Merge Request Hook" } }
        - { name: X-Gitlab-Token, in: header, required: true, schema: { type: string, minLength: 32, maxLength: 4096, writeOnly: true } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Authenticated delivery was atomically applied or recognized as a replay
          content: { application/json: { schema: { $ref: "#/components/schemas/GitHubDeliveryResult" } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /workflow/states:
    get:
      summary: List stable workflow state names
      operationId: listWorkflowStates
      responses:
        "200":
          description: Stable workflow state names
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/JobState" } }
        default: { $ref: "#/components/responses/ErrorResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /projects:
    get:
      summary: List registered repository projects
      operationId: listProjects
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Registered projects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Project" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Register or update a validated project
      operationId: upsertProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertProjectRequest" }
      responses:
        "201":
          description: Registered project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    delete:
      summary: Soft-disable a registered project while retaining audit and job history
      operationId: disableProject
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Disabled project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/actions/sync:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    post:
      summary: Synchronize a registered repository through the credential-isolated Git bridge
      operationId: syncProject
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Exact synchronized default-branch commit, content: { application/json: { schema: { $ref: "#/components/schemas/RepositorySyncResult" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/diagnostics:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      summary: Read credential-safe repository and provider diagnostics
      operationId: getProjectDiagnostics
      responses:
        "200": { description: Repository diagnostics without credentials, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /capability-packs:
    get:
      summary: Browse controller-trusted checksummed capability-pack versions
      operationId: listCapabilityPacks
      responses:
        "200":
          description: Trusted declarative catalog
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, items]
                properties:
                  schema_version: { type: integer, const: 1 }
                  items: { type: array, items: { $ref: "#/components/schemas/CapabilityManifest" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /capability-packs/installations:
    get:
      summary: List durable pack installations and pins
      operationId: listCapabilityInstallations
      responses:
        "200":
          description: Installed packs
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/CapabilityInstallation" } } } } } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /capability-packs/{packID}/versions/{version}:
    parameters:
      - { name: packID, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,127}$" } }
      - { name: version, in: path, required: true, schema: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" } }
    get:
      summary: Inspect effective declarative content and trust status
      operationId: getCapabilityManifest
      responses:
        "200":
          description: Exact trusted manifest
          content:
            application/json:
              schema:
                type: object
                required: [manifest, trust]
                properties:
                  manifest: { $ref: "#/components/schemas/CapabilityManifest" }
                  trust: { $ref: "#/components/schemas/CapabilityTrustReport" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /capability-packs/{packID}/events:
    parameters: [{ name: packID, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,127}$" } }]
    get:
      summary: List append-only pack lifecycle events
      operationId: listCapabilityEvents
      responses:
        "200":
          description: Pack history
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/CapabilityLifecycleEvent" } } } } } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /capability-packs/{packID}/actions/preview:
    parameters: [{ name: packID, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,127}$" } }]
    post:
      summary: Preview pack trust, prerequisites, and workflow changes without mutation
      operationId: previewCapabilityTransition
      parameters:
        - { name: action, in: query, required: true, schema: { type: string, enum: [install, upgrade, rollback] } }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CapabilityTransitionRequest" } } } }
      responses:
        "200": { description: Read-only transition preview, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /capability-packs/{packID}/actions/{action}:
    parameters:
      - { name: packID, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,127}$" } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [install, enable, disable, upgrade, rollback, pin, unpin] } }
    post:
      summary: Apply a reauthenticated optimistic pack lifecycle transition
      operationId: transitionCapabilityPack
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CapabilityTransitionRequest" } } } }
      responses:
        "200":
          description: Applied transition
          content:
            application/json:
              schema:
                type: object
                required: [installation, event]
                properties:
                  installation: { $ref: "#/components/schemas/CapabilityInstallation" }
                  event: { $ref: "#/components/schemas/CapabilityLifecycleEvent" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/capability-packs:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      summary: List exact project pack assignments and configuration
      operationId: listProjectCapabilityAssignments
      responses:
        "200":
          description: Project assignments
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/CapabilityAssignment" } } } } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/capability-packs/{packID}/actions/preview-configuration:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { name: packID, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,127}$" } }
    post:
      summary: Validate and preview a typed project pack configuration without mutation
      operationId: previewCapabilityAssignmentConfiguration
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CapabilityAssignmentConfigurationRequest" } } } }
      responses:
        "200": { description: Normalized effective configuration and workflow impact, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/capability-packs/{packID}/configuration:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { name: packID, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,127}$" } }
    put:
      summary: Apply an optimistic audited controller-validated project pack configuration
      operationId: updateCapabilityAssignmentConfiguration
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CapabilityAssignmentConfigurationRequest" } } } }
      responses:
        "200": { description: Updated exact project pack assignment, content: { application/json: { schema: { $ref: "#/components/schemas/CapabilityAssignment" } } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/repo-doctor/scans:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      summary: List evidence-backed onboarding scans and configuration drift
      operationId: listRepoDoctorScans
      responses:
        "200":
          description: Repository scans
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/RepoDoctorScan" } } } } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/repo-doctor/actions/scan:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    post:
      summary: Analyze a bounded trusted repository snapshot without modifying it
      operationId: runRepoDoctor
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "201": { description: Completed scan with disabled proposals, content: { application/json: { schema: { $ref: "#/components/schemas/RepoDoctorScan" } } } }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/repo-doctor/scans/{scanID}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { name: scanID, in: path, required: true, schema: { type: string, pattern: "^scan_[a-f0-9]{32}$" } }
    get:
      summary: Inspect findings, evidence, proposals, and drift from one scan
      operationId: getRepoDoctorScan
      responses:
        "200": { description: Onboarding scan, content: { application/json: { schema: { $ref: "#/components/schemas/RepoDoctorScan" } } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/repo-doctor/scans/{scanID}/proposals/{proposalID}/actions/dry-run:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { name: scanID, in: path, required: true, schema: { type: string, pattern: "^scan_[a-f0-9]{32}$" } }
      - { name: proposalID, in: path, required: true, schema: { type: string, pattern: "^proposal_[a-f0-9]{32}$" } }
    post:
      summary: Preview a pending proposal and its workflow diff without mutation
      operationId: dryRunRepoDoctorProposal
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RepoDoctorProposalRequest" } } } }
      responses:
        "200": { description: Proposal preview, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/repo-doctor/scans/{scanID}/proposals/{proposalID}/actions/{action}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { name: scanID, in: path, required: true, schema: { type: string, pattern: "^scan_[a-f0-9]{32}$" } }
      - { name: proposalID, in: path, required: true, schema: { type: string, pattern: "^proposal_[a-f0-9]{32}$" } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [accept, reject] } }
    post:
      summary: Explicitly accept or reject an optimistic evidence-backed proposal
      operationId: reviewRepoDoctorProposal
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RepoDoctorProposalRequest" } } } }
      responses:
        "200":
          description: Reviewed proposal and optional exact pack assignment
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
