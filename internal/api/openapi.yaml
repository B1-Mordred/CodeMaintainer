openapi: 3.1.0
info:
  title: Local Code Maintainer Controller API
  version: 0.1.0
  description: Trusted workflow control API. No endpoint accepts arbitrary commands, images, mounts, model paths, or container options.
  license:
    name: Unlicensed foundation build
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8080/api/v1
security:
  - sessionCookie: []
paths:
  /auth/status:
    get:
      security: []
      summary: Report whether one-time administrator bootstrap is complete
      operationId: getAuthenticationStatus
      responses:
        "200":
          description: Authentication bootstrap status
          content:
            application/json:
              schema:
                type: object
                required: [bootstrapped, authentication_enabled]
                properties:
                  bootstrapped: { type: boolean }
                  authentication_enabled: { type: boolean }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /auth/bootstrap:
    post:
      security: []
      summary: Create the one-time local administrator and authenticated session
      operationId: bootstrapAdministrator
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BootstrapRequest" } } }
      responses:
        "201":
          description: Bootstrap administrator session
          headers:
            Set-Cookie: { schema: { type: string } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticationResult" } } }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/login:
    post:
      security: []
      summary: Create a bounded local session
      operationId: login
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        "200":
          description: Authenticated session
          headers:
            Set-Cookie: { schema: { type: string } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticationResult" } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/session:
    get:
      summary: Get the current principal and rotate its CSRF token
      operationId: getAuthenticationSession
      responses:
        "200":
          description: Current principal and fresh CSRF token
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticationResult" } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /auth/reauthenticate:
    post:
      summary: Reauthenticate the current session for a five-minute sensitive-action window
      operationId: reauthenticate
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 14, maxLength: 1024, writeOnly: true }
      responses:
        "200":
          description: Recently reauthenticated principal
          content:
            application/json:
              schema:
                type: object
                required: [principal]
                properties:
                  principal: { $ref: "#/components/schemas/Principal" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/logout:
    post:
      summary: Revoke the current session
      operationId: logout
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Session revoked and cookie expired }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /admin/users:
    get:
      summary: List local users and exact roles
      operationId: listUsers
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Local users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Create a local user after recent administrator reauthentication
      operationId: createUser
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateUserRequest" } } }
      responses:
        "201": { description: Created user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /admin/users/{userID}:
    parameters:
      - { name: userID, in: path, required: true, schema: { type: string, pattern: "^user_[0-9a-f]{32}$" } }
    put:
      summary: Update a local user's display name, exact role, and enabled state
      operationId: updateUser
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateUserRequest" } } }
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /admin/backups:
    get:
      summary: List locally retained checksum-bound backups
      operationId: listBackups
      responses:
        "200":
          description: Backup inventory
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/BackupRecord" } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Create a consistent state backup after recent reauthentication
      operationId: createBackup
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "201": { description: Created backup, content: { application/json: { schema: { $ref: "#/components/schemas/BackupRecord" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /admin/backups/{backupID}/actions/restore:
    parameters:
      - { name: backupID, in: path, required: true, schema: { type: string, pattern: "^backup_[A-Za-z0-9.T:-]+$" } }
    post:
      summary: Validate backup checksums and schema compatibility without replacing live state
      operationId: validateBackupRestore
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dry_run]
              properties:
                dry_run: { type: boolean }
      responses:
        "200": { description: Restore dry-run report, content: { application/json: { schema: { $ref: "#/components/schemas/BackupRestoreReport" } } } }
        "202": { description: Validated restore staged for the next full appliance restart, content: { application/json: { schema: { $ref: "#/components/schemas/BackupRestoreResult" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /admin/update/preflight:
    get:
      summary: Check controller, configuration, database, and backup readiness for an operator update
      operationId: getUpdatePreflight
      responses:
        "200":
          description: Non-mutating update readiness report
          content:
            application/json:
              schema:
                type: object
                required: [ready, version, profile, backup_count, checks]
                properties:
                  ready: { type: boolean }
                  version: { type: string }
                  profile: { type: string }
                  backup_count: { type: integer, minimum: 0 }
                  checks:
                    type: array
                    items:
                      type: object
                      required: [name, status, detail]
                      properties:
                        name: { type: string }
                        status: { type: string, enum: [passed, warning, failed] }
                        detail: { type: string }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /system/status:
    get:
      summary: Get bounded system and component status
      operationId: getSystemStatus
      responses:
        "200":
          description: Current bounded component status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        default: { $ref: "#/components/responses/ErrorResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /github/webhooks:
    post:
      security: []
      summary: Receive a GitHub pull-request webhook and validate its HMAC in the isolated GitHub bridge
      operationId: receiveGitHubWebhook
      parameters:
        - { name: X-GitHub-Delivery, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: X-GitHub-Event, in: header, required: true, schema: { type: string, const: pull_request } }
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string, pattern: "^sha256=[a-f0-9]{64}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Authenticated delivery was atomically applied or recognized as a replay
          content: { application/json: { schema: { $ref: "#/components/schemas/GitHubDeliveryResult" } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /workflow/states:
    get:
      summary: List stable workflow state names
      operationId: listWorkflowStates
      responses:
        "200":
          description: Stable workflow state names
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/JobState" } }
        default: { $ref: "#/components/responses/ErrorResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /projects:
    get:
      summary: List registered repository projects
      operationId: listProjects
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Registered projects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Project" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Register or update a validated project
      operationId: upsertProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertProjectRequest" }
      responses:
        "201":
          description: Registered project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    delete:
      summary: Soft-disable a registered project while retaining audit and job history
      operationId: disableProject
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Disabled project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/actions/sync:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    post:
      summary: Synchronize a registered repository through the credential-isolated Git bridge
      operationId: syncProject
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Exact synchronized default-branch commit, content: { application/json: { schema: { $ref: "#/components/schemas/RepositorySyncResult" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/diagnostics:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      summary: Read credential-safe repository and provider diagnostics
      operationId: getProjectDiagnostics
      responses:
        "200": { description: Repository diagnostics without credentials, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    get:
      summary: Browse or perform a bounded project-scoped canonical memory retrieval
      operationId: listProjectMemory
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 4096 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/MemoryStatus" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200":
          description: Project memory records and, for search, its bounded retrieval trace
          content:
            application/json:
              schema:
                type: object
                required: [items, namespace]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MemoryRecord" } }
                  namespace: { type: string }
                  retrieval: { $ref: "#/components/schemas/MemoryRetrievalTrace" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Create a secret-scanned provisional memory candidate in the registered project scope
      operationId: createProjectMemory
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryCandidateRequest" } } }
      responses:
        "201":
          description: Quarantined memory candidate
          content: { application/json: { schema: { $ref: "#/components/schemas/MemoryRecord" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/retrievals:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    get:
      summary: List append-only retrieval traces for one registered project
      operationId: listProjectMemoryRetrievals
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Project retrieval history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MemoryRetrievalTrace" } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/export:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    get:
      summary: Export at most 100 active project records in a manifest-hashed schema-versioned bundle
      operationId: exportProjectMemory
      responses:
        "200":
          description: Project-bound memory export
          headers:
            Content-Disposition: { schema: { type: string } }
          content: { application/json: { schema: { $ref: "#/components/schemas/MemoryExportBundle" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/actions/restore:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    post:
      summary: Dry-run or restore a validated same-project bundle into quarantine
      operationId: restoreProjectMemory
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryRestoreRequest" } } }
      responses:
        "200":
          description: Dry-run report; no records were written
          content: { application/json: { schema: { $ref: "#/components/schemas/MemoryRestoreReport" } } }
        "201":
          description: Atomic restore report
          content: { application/json: { schema: { $ref: "#/components/schemas/MemoryRestoreReport" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/actions/reindex:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    post:
      summary: Queue canonical records for index rebuild and request a bounded OpenViking reindex
      operationId: reindexProjectMemory
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: { type: string, enum: [vectors_only, semantic_and_vectors] }
      responses:
        "202":
          description: Durable project memory rebuild accepted
          content:
            application/json:
              schema:
                type: object
                required: [status, records_queued, namespace, mode]
                properties:
                  status: { type: string, const: queued }
                  records_queued: { type: integer, minimum: 0 }
                  namespace: { type: string }
                  mode: { type: string, enum: [vectors_only, semantic_and_vectors] }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/actions/smoke-index:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    post:
      summary: Run a bounded scoped health/write/search/delete smoke test against the configured memory index
      operationId: smokeProjectMemoryIndex
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200":
          description: Configured index smoke test passed and the derived marker was deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, namespace, record_id, search_seen, duration_ns]
                properties:
                  status: { type: string, const: passed }
                  namespace: { type: string }
                  record_id: { type: string, pattern: "^memory_[a-f0-9]{32}$" }
                  search_seen: { type: boolean, const: true }
                  duration_ns: { type: integer, minimum: 0 }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "500": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/{memoryID}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/MemoryID" }
    get:
      summary: Inspect one memory record only within its registered project scope
      operationId: getProjectMemory
      responses:
        "200":
          description: Project memory record
          content: { application/json: { schema: { $ref: "#/components/schemas/MemoryRecord" } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/{memoryID}/events:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/MemoryID" }
    get:
      summary: List the append-only lifecycle for one project memory record
      operationId: listProjectMemoryEvents
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Memory record events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MemoryEvent" } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/{memoryID}/actions/promote:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/MemoryID" }
    post:
      summary: Promote an eligible quarantined record after reviewer or administrator approval
      operationId: promoteProjectMemory
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryPromotionRequest" } } }
      responses:
        "200":
          description: Canonical memory record
          content: { application/json: { schema: { $ref: "#/components/schemas/MemoryRecord" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/{memoryID}/actions/correct:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/MemoryID" }
    post:
      summary: Correct a memory record and return it to quarantine
      operationId: correctProjectMemory
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryCorrectionRequest" } } }
      responses:
        "200":
          description: Corrected quarantined memory record
          content: { application/json: { schema: { $ref: "#/components/schemas/MemoryRecord" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/{memoryID}/actions/invalidate:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/MemoryID" }
    post:
      summary: Mark a quarantined or canonical memory record stale
      operationId: invalidateProjectMemory
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryLifecycleRequest" } } }
      responses:
        "200":
          description: Stale memory record
          content: { application/json: { schema: { $ref: "#/components/schemas/MemoryRecord" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/{memoryID}/actions/delete:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/MemoryID" }
    post:
      summary: Clear memory content after administrator recent reauthentication
      operationId: deleteProjectMemory
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryLifecycleRequest" } } }
      responses:
        "204": { description: Memory content cleared and tombstone retained }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /schedules:
    get:
      summary: List administrator-managed serial schedules
      operationId: listSchedules
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Schedule" } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Create or version-update a bounded serial schedule
      operationId: saveSchedule
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleRequest" } } }
      responses:
        "201":
