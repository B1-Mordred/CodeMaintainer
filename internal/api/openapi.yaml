openapi: 3.1.0
info:
  title: Local Code Maintainer Controller API
  version: 0.1.0
  description: Trusted workflow control API. No endpoint accepts arbitrary commands, images, mounts, model paths, or container options.
  license:
    name: Unlicensed foundation build
servers:
  - url: http://127.0.0.1:8080/api/v1
security:
  - sessionCookie: []
paths:
  /auth/status:
    get:
      security: []
      summary: Report whether one-time administrator bootstrap is complete
      operationId: getAuthenticationStatus
      responses:
        "200":
          description: Authentication bootstrap status
          content:
            application/json:
              schema:
                type: object
                required: [bootstrapped, authentication_enabled]
                properties:
                  bootstrapped: { type: boolean }
                  authentication_enabled: { type: boolean }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /auth/bootstrap:
    post:
      security: []
      summary: Create the one-time local administrator and authenticated session
      operationId: bootstrapAdministrator
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BootstrapRequest" } } }
      responses:
        "201":
          description: Bootstrap administrator session
          headers:
            Set-Cookie: { schema: { type: string } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticationResult" } } }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/login:
    post:
      security: []
      summary: Create a bounded local session
      operationId: login
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        "200":
          description: Authenticated session
          headers:
            Set-Cookie: { schema: { type: string } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticationResult" } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/session:
    get:
      summary: Get the current principal and rotate its CSRF token
      operationId: getAuthenticationSession
      responses:
        "200":
          description: Current principal and fresh CSRF token
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthenticationResult" } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /auth/reauthenticate:
    post:
      summary: Reauthenticate the current session for a five-minute sensitive-action window
      operationId: reauthenticate
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 14, maxLength: 1024, writeOnly: true }
      responses:
        "200":
          description: Recently reauthenticated principal
          content:
            application/json:
              schema:
                type: object
                required: [principal]
                properties:
                  principal: { $ref: "#/components/schemas/Principal" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/logout:
    post:
      summary: Revoke the current session
      operationId: logout
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: Session revoked and cookie expired }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /system/status:
    get:
      summary: Get bounded system and component status
      operationId: getSystemStatus
      responses:
        "200":
          description: Current bounded component status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        default: { $ref: "#/components/responses/ErrorResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /workflow/states:
    get:
      summary: List stable workflow state names
      operationId: listWorkflowStates
      responses:
        "200":
          description: Stable workflow state names
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/JobState" } }
        default: { $ref: "#/components/responses/ErrorResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /projects:
    get:
      summary: List registered repository projects
      operationId: listProjects
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Registered projects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Project" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Register or update a validated project
      operationId: upsertProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertProjectRequest" }
      responses:
        "201":
          description: Registered project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    get:
      summary: Browse or perform a bounded project-scoped canonical memory retrieval
      operationId: listProjectMemory
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 4096 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/MemoryStatus" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200":
          description: Project memory records and, for search, its bounded retrieval trace
          content:
            application/json:
              schema:
                type: object
                required: [items, namespace]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MemoryRecord" } }
                  namespace: { type: string }
                  retrieval: { $ref: "#/components/schemas/MemoryRetrievalTrace" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Create a secret-scanned provisional memory candidate in the registered project scope
      operationId: createProjectMemory
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryCandidateRequest" } } }
      responses:
        "201":
          description: Quarantined memory candidate
          content: { application/json: { schema: { $ref: "#/components/schemas/MemoryRecord" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/retrievals:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    get:
      summary: List append-only retrieval traces for one registered project
      operationId: listProjectMemoryRetrievals
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Project retrieval history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MemoryRetrievalTrace" } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/actions/reindex:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
    post:
      summary: Queue canonical records for index rebuild and request a bounded OpenViking reindex
      operationId: reindexProjectMemory
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: { type: string, enum: [vectors_only, semantic_and_vectors] }
      responses:
        "202":
          description: Durable project memory rebuild accepted
          content:
            application/json:
              schema:
                type: object
                required: [status, records_queued, namespace, mode]
                properties:
                  status: { type: string, const: queued }
                  records_queued: { type: integer, minimum: 0 }
                  namespace: { type: string }
                  mode: { type: string, enum: [vectors_only, semantic_and_vectors] }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/{memoryID}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/MemoryID" }
    get:
      summary: Inspect one memory record only within its registered project scope
      operationId: getProjectMemory
      responses:
        "200":
          description: Project memory record
          content: { application/json: { schema: { $ref: "#/components/schemas/MemoryRecord" } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/{memoryID}/events:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/MemoryID" }
    get:
      summary: List the append-only lifecycle for one project memory record
      operationId: listProjectMemoryEvents
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Memory record events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MemoryEvent" } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/{memoryID}/actions/promote:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/MemoryID" }
    post:
      summary: Promote an eligible quarantined record after reviewer or administrator approval
      operationId: promoteProjectMemory
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryPromotionRequest" } } }
      responses:
        "200":
          description: Canonical memory record
          content: { application/json: { schema: { $ref: "#/components/schemas/MemoryRecord" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/{memoryID}/actions/correct:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/MemoryID" }
    post:
      summary: Correct a memory record and return it to quarantine
      operationId: correctProjectMemory
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryCorrectionRequest" } } }
      responses:
        "200":
          description: Corrected quarantined memory record
          content: { application/json: { schema: { $ref: "#/components/schemas/MemoryRecord" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/{memoryID}/actions/invalidate:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/MemoryID" }
    post:
      summary: Mark a quarantined or canonical memory record stale
      operationId: invalidateProjectMemory
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryLifecycleRequest" } } }
      responses:
        "200":
          description: Stale memory record
          content: { application/json: { schema: { $ref: "#/components/schemas/MemoryRecord" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /projects/{projectID}/memory/{memoryID}/actions/delete:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/MemoryID" }
    post:
      summary: Clear memory content after administrator recent reauthentication
      operationId: deleteProjectMemory
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryLifecycleRequest" } } }
      responses:
        "204": { description: Memory content cleared and tombstone retained }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /schedules:
    get:
      summary: List administrator-managed serial schedules
      operationId: listSchedules
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Schedule" } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Create or version-update a bounded serial schedule
      operationId: saveSchedule
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleRequest" } } }
      responses:
        "201":
          description: Saved schedule
          content: { application/json: { schema: { $ref: "#/components/schemas/Schedule" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /schedule-runs:
    get:
      summary: List append-only schedule dispatch and window-skip history
      operationId: listScheduleRuns
      responses:
        "200":
          description: Schedule run history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ScheduleRun" } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /skill-proposals:
    get:
      summary: List inert Hermes skill proposals and administrator decisions
      operationId: listSkillProposals
      responses:
        "200":
          description: Skill proposal queue
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SkillProposal" } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /skill-proposals/{proposalID}/actions/review:
    parameters:
      - name: proposalID
        in: path
        required: true
        schema: { type: string, pattern: "^skillproposal_[0-9a-f]{32}$" }
    post:
      summary: Approve-as-inert or reject a proposed skill without activating it
      operationId: reviewSkillProposal
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SkillReviewRequest" } } }
      responses:
        "200":
          description: Reviewed but never automatically activated proposal
          content: { application/json: { schema: { $ref: "#/components/schemas/SkillProposal" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /automation-requests:
    get:
      summary: List append-only Hermes review and publication-approval requests
      operationId: listAutomationRequests
      responses:
        "200":
          description: Requests that confer no approval authority
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AutomationRequest" } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /hermes/tools/jobs/submit:
    post:
      security: [{ hermesBearer: [] }]
      summary: Submit a bounded job to an enabled registered project
      operationId: hermesSubmitJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_id, task]
              properties:
                project_id: { type: string }
                task: { type: string, minLength: 1, maxLength: 1048576 }
                issue_number: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Durable queued job
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /hermes/tools/jobs:
    get:
      security: [{ hermesBearer: [] }]
      summary: List bounded job status for Hermes
      operationId: hermesListJobs
      responses:
        "200": { description: Jobs, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /hermes/tools/jobs/{jobID}:
    parameters: [{ $ref: "#/components/parameters/JobID" }]
    get:
      security: [{ hermesBearer: [] }]
      summary: Retrieve one job status
      operationId: hermesGetJobStatus
      responses:
        "200": { description: Job status, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /hermes/tools/jobs/{jobID}/cancel:
    parameters: [{ $ref: "#/components/parameters/JobID" }]
    post:
      security: [{ hermesBearer: [] }]
      summary: Request cancellation through the normal workflow state machine
      operationId: hermesCancelJob
      responses:
        "200": { description: Cancelled job, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /hermes/tools/jobs/{jobID}/report:
    parameters: [{ $ref: "#/components/parameters/JobID" }]
    get:
      security: [{ hermesBearer: [] }]
      summary: Retrieve bounded report, phase, finding, and artifact metadata
      operationId: hermesGetJobReport
      responses:
        "200": { description: Job report, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /hermes/tools/jobs/{jobID}/request-review:
    parameters: [{ $ref: "#/components/parameters/JobID" }]
    post:
      security: [{ hermesBearer: [] }]
      summary: Create a non-authoritative human review request
      operationId: hermesRequestReview
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AutomationRequestInput" } } }
      responses:
        "202": { description: Append-only request, content: { application/json: { schema: { $ref: "#/components/schemas/AutomationRequest" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /hermes/tools/jobs/{jobID}/request-publication-approval:
    parameters: [{ $ref: "#/components/parameters/JobID" }]
    post:
      security: [{ hermesBearer: [] }]
      summary: Request an operator decision without granting publication approval
      operationId: hermesRequestPublicationApproval
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AutomationRequestInput" } } }
      responses:
        "202": { description: Append-only request, content: { application/json: { schema: { $ref: "#/components/schemas/AutomationRequest" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /hermes/tools/projects/{projectID}/memory:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      security: [{ hermesBearer: [] }]
      summary: Read only project-scoped canonical memory through the controller
      operationId: hermesReadProjectMemory
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 4096 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200": { description: Project-scoped memory, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /hermes/tools/schedules:
    get:
      security: [{ hermesBearer: [] }]
      summary: Read administrator-configured schedule status
      operationId: hermesListSchedules
      responses:
        "200": { description: Schedules, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /hermes/tools/skill-proposals:
    post:
      security: [{ hermesBearer: [] }]
      summary: Submit a secret-scanned inert skill proposal for administrator review
      operationId: hermesCreateSkillProposal
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SkillProposalInput" } } }
      responses:
        "201": { description: Inert proposal, content: { application/json: { schema: { $ref: "#/components/schemas/SkillProposal" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /jobs:
    get:
      summary: List a bounded page of jobs
      operationId: listJobs
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Bounded job page
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Job" } }
                  limit: { type: integer }
                  offset: { type: integer }
        default: { $ref: "#/components/responses/ErrorResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Submit a maintenance job
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateJobRequest" }
      responses:
        "201":
          description: Durable queued job
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /jobs/{jobID}:
    parameters:
      - { $ref: "#/components/parameters/JobID" }
    get:
      summary: Inspect one job and its durable timeline
      operationId: getJob
      responses:
        "200":
          description: Job plus durable state timeline
          content:
            application/json:
              schema:
                type: object
                required: [job, transitions, findings, approvals, phases]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
                  transitions: { type: array, items: { $ref: "#/components/schemas/Transition" } }
                  findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
                  approvals: { type: array, items: { $ref: "#/components/schemas/Approval" } }
                  phases: { type: array, items: { $ref: "#/components/schemas/PhaseRecord" } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /jobs/{jobID}/events:
    parameters:
      - { $ref: "#/components/parameters/JobID" }
      - { name: after, in: query, schema: { type: integer, minimum: 0 } }
    get:
      summary: Stream replayable job transition events
      operationId: streamJobEvents
      responses:
        "200":
          description: Bounded replayable server-sent transition events; Last-Event-ID is supported.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/ErrorResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /jobs/{jobID}/artifacts:
    parameters:
      - { $ref: "#/components/parameters/JobID" }
    get:
      summary: List immutable evidence artifacts for one job
      operationId: listJobArtifacts
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Job-scoped artifact metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Artifact" } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /jobs/{jobID}/artifacts/{artifactID}:
    parameters:
      - { $ref: "#/components/parameters/JobID" }
      - { $ref: "#/components/parameters/ArtifactID" }
    get:
      summary: Download one integrity-checked job evidence artifact
      operationId: downloadJobArtifact
      responses:
        "200":
          description: Verified artifact bytes; Content-Type reflects stored media metadata.
          headers:
            X-Artifact-SHA256: { schema: { type: string, pattern: "^[a-f0-9]{64}$" } }
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /jobs/{jobID}/actions/cancel:
    parameters:
      - { $ref: "#/components/parameters/JobID" }
    post:
      summary: Cancel an active or waiting job
      operationId: cancelJob
      responses:
        "200":
          description: Cancelled job
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /jobs/{jobID}/actions/retry:
    parameters:
      - { $ref: "#/components/parameters/JobID" }
    post:
      summary: Requeue a failed or cancelled job
      operationId: retryJob
      responses:
        "200":
          description: Requeued failed or cancelled job
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /jobs/{jobID}/actions/approve-publication:
    parameters:
      - { $ref: "#/components/parameters/JobID" }
    post:
      summary: Approve exact-result draft publication after recent reauthentication
      operationId: approvePublication
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rationale]
              properties:
                rationale: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: Exact-SHA approval and publishing job
          content:
            application/json:
              schema:
                type: object
                required: [job, approval]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
                  approval: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /config:
    get:
      summary: Get the current validated configuration
      operationId: getConfig
      responses:
        "200":
          description: Current validated configuration and revision metadata
          content:
            application/json:
              schema:
                type: object
                required: [revision, document]
                properties:
                  revision: { $ref: "#/components/schemas/ConfigRevision" }
                  document: { $ref: "#/components/schemas/SystemConfig" }
        default: { $ref: "#/components/responses/ErrorResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /config/validate:
    post:
      summary: Validate a proposed configuration without saving it
      operationId: validateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigDocumentRequest" }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /config/revisions:
    get:
      summary: List configuration revision history
      operationId: listConfigRevisions
      responses:
        "200":
          description: Newest-first configuration revisions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ConfigRevision" } }
        default: { $ref: "#/components/responses/ErrorResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
    post:
      summary: Validate and save a configuration revision
      operationId: createConfigRevision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigDocumentRequest" }
      responses:
        "201":
          description: Created configuration revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRevision" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /config/revisions/{revisionID}/rollback:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      summary: Create a new revision matching a selected rollback point
      operationId: rollbackConfigRevision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: Created rollback revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRevision" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /audit:
    get:
      summary: List append-only audit events
      operationId: listAuditEvents
      responses:
        "200":
          description: Bounded append-only audit page
          content: { application/json: { schema: { type: object } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: maintainer_session
    hermesBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  parameters:
    JobID:
      name: jobID
      in: path
      required: true
      schema: { type: string, pattern: "^job_[0-9a-f]{32}$" }
    RevisionID:
      name: revisionID
      in: path
      required: true
      schema: { type: string, pattern: "^config_[0-9a-f]{32}$" }
    ArtifactID:
      name: artifactID
      in: path
      required: true
      schema: { type: string, pattern: "^artifact_[0-9a-f]{32}$" }
    ProjectID:
      name: projectID
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
    MemoryID:
      name: memoryID
      in: path
      required: true
      schema: { type: string, pattern: "^memory_[0-9a-f]{32}$" }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 256 }
  responses:
    ErrorResponse:
      description: Structured error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    User:
      type: object
      required: [id, username, display_name, role, disabled, created_at, updated_at]
      properties:
        id: { type: string, pattern: "^user_[0-9a-f]{32}$" }
        username: { type: string, minLength: 3, maxLength: 64, pattern: "^[a-z0-9._-]+$" }
        display_name: { type: string, minLength: 1, maxLength: 128 }
        role: { type: string, enum: [viewer, operator, reviewer, administrator] }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Principal:
      type: object
      required: [user, expires_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        expires_at: { type: string, format: date-time }
        reauthenticated_until: { type: string, format: date-time }
    AuthenticationResult:
      type: object
      required: [principal, csrf_token]
      properties:
        principal: { $ref: "#/components/schemas/Principal" }
        csrf_token: { type: string, minLength: 32, maxLength: 256, writeOnly: true }
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [username, display_name, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$" }
        display_name: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 14, maxLength: 1024, writeOnly: true }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 14, maxLength: 1024, writeOnly: true }
    UpsertProjectRequest:
      type: object
      additionalProperties: false
      required: [id, provider, repository, default_branch]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        provider: { type: string, enum: [local, github] }
        repository: { type: string, pattern: "^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$", maxLength: 201 }
        default_branch: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        local_remote_name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\\.git$" }
    Project:
      allOf:
        - { $ref: "#/components/schemas/UpsertProjectRequest" }
        - type: object
          required: [enabled, created_at, updated_at]
          properties:
            enabled: { type: boolean }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    MemoryStatus:
      type: string
      enum: [quarantine, canonical, stale, deleted]
    MemoryScope:
      type: object
      required: [owner, repository]
      properties:
        owner: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        repository: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
    MemoryCandidateRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 65536 }
        kind: { type: string, enum: [project_knowledge, verified_case, failed_case, pattern, known_issue, flaky_test, issue_history] }
        source_uri: { type: string, maxLength: 2048 }
        base_commit: { type: string, pattern: "^[a-fA-F0-9]{40}$" }
        merged_commit: { type: string, pattern: "^[a-fA-F0-9]{40}$" }
        affected_paths: { type: array, maxItems: 1000, items: { type: string, minLength: 1, maxLength: 4096 } }
        invalidation_rule: { type: string, maxLength: 4096 }
        expires_at: { type: string, format: date-time }
    MemoryPromotionRequest:
      type: object
      additionalProperties: false
      required: [rationale, basis, expected_version]
      properties:
        rationale: { type: string, minLength: 1, maxLength: 4096 }
        basis: { type: string, enum: [deterministic_verification, merged_pr, human_approval] }
        merged_commit: { type: string, pattern: "^[a-fA-F0-9]{40}$" }
        expected_version: { type: integer, minimum: 1 }
    MemoryCorrectionRequest:
      type: object
      additionalProperties: false
      required: [content, rationale, expected_version]
      properties:
        content: { type: string, minLength: 1, maxLength: 65536 }
        affected_paths: { type: array, maxItems: 1000, items: { type: string, minLength: 1, maxLength: 4096 } }
        invalidation_rule: { type: string, maxLength: 4096 }
        rationale: { type: string, minLength: 1, maxLength: 4096 }
        expected_version: { type: integer, minimum: 1 }
    MemoryLifecycleRequest:
      type: object
      additionalProperties: false
      required: [rationale, expected_version]
      properties:
        rationale: { type: string, minLength: 1, maxLength: 4096 }
        expected_version: { type: integer, minimum: 1 }
    MemoryRecord:
      type: object
      required: [id, scope, namespace, content, content_hash, source_uri, base_commit, affected_paths, status, verified, secret_scan_pass, kind, version, created_at, updated_at]
      properties:
        id: { type: string, pattern: "^memory_[0-9a-f]{32}$" }
        scope: { $ref: "#/components/schemas/MemoryScope" }
        namespace: { type: string, pattern: "^viking://resources/projects/[^/]+/[^/]+/$" }
        content: { type: string, maxLength: 65536 }
        content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        source_uri: { type: string, maxLength: 2048 }
        base_commit: { type: string, pattern: "^$|^[a-fA-F0-9]{40}$" }
        merged_commit: { type: string, pattern: "^[a-fA-F0-9]{40}$" }
        affected_paths: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/MemoryStatus" }
        verified: { type: boolean }
        secret_scan_pass: { type: boolean }
        kind: { type: string }
        invalidation_rule: { type: string }
        expires_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MemoryEvent:
      type: object
      required: [sequence, record_id, scope, action, actor_id, rationale, details, created_at]
      properties:
        sequence: { type: integer, minimum: 1 }
        record_id: { type: string }
        scope: { $ref: "#/components/schemas/MemoryScope" }
        action: { type: string }
        actor_id: { type: string }
        rationale: { type: string }
        details: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    MemoryRetrievalTrace:
      type: object
      required: [id, scope, namespace, query, query_hash, candidate_ids, selected_ids, budget_tokens, allocated_tokens, trajectory, created_at]
      properties:
        id: { type: string, pattern: "^retrieval_[0-9a-f]{32}$" }
        job_id: { type: string }
        scope: { $ref: "#/components/schemas/MemoryScope" }
        namespace: { type: string }
        query: { type: string, maxLength: 4096 }
        query_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        candidate_ids: { type: array, items: { type: string } }
        selected_ids: { type: array, items: { type: string } }
        budget_tokens: { type: integer, minimum: 0, maximum: 8192 }
        allocated_tokens: { type: integer, minimum: 0, maximum: 8192 }
        trajectory: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    ScheduleRequest:
      type: object
      additionalProperties: false
      required: [project_id, name, task_type, task, interval_seconds, window_start_minute, window_end_minute, max_wall_seconds, max_tokens, enabled]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string, minLength: 1, maxLength: 128 }
        task_type: { type: string, enum: [maintenance, sync, audit] }
        task: { type: string, minLength: 1, maxLength: 65536 }
        interval_seconds: { type: integer, minimum: 60, maximum: 2678400 }
        window_start_minute: { type: integer, minimum: 0, maximum: 1439 }
        window_end_minute: { type: integer, minimum: 0, maximum: 1439 }
        max_wall_seconds: { type: integer, minimum: 60, maximum: 604800 }
        max_tokens: { type: integer, minimum: 1, maximum: 10000000 }
        enabled: { type: boolean }
        next_run_at: { type: string, format: date-time }
        expected_version: { type: integer, minimum: 1 }
    Schedule:
      allOf:
        - { $ref: "#/components/schemas/ScheduleRequest" }
        - type: object
          required: [id, next_run_at, version, created_at, updated_at]
          properties:
            id: { type: string, pattern: "^schedule_[0-9a-f]{32}$" }
            next_run_at: { type: string, format: date-time }
            version: { type: integer, minimum: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    ScheduleRun:
      type: object
      required: [sequence, id, schedule_id, status, reason, due_at, created_at]
      properties:
        sequence: { type: integer, minimum: 1 }
        id: { type: string }
        schedule_id: { type: string }
        job_id: { type: string }
        status: { type: string, enum: [enqueued, skipped] }
        reason: { type: string }
        due_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    SkillProposalInput:
      type: object
      additionalProperties: false
      required: [name, description, content]
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
        description: { type: string, minLength: 1, maxLength: 4096 }
        content: { type: string, minLength: 1, maxLength: 65536 }
    SkillReviewRequest:
      type: object
      additionalProperties: false
      required: [decision, rationale, expected_version]
      properties:
        decision: { type: string, enum: [approve, reject] }
        rationale: { type: string, minLength: 1, maxLength: 4096 }
        expected_version: { type: integer, minimum: 1 }
    SkillProposal:
      allOf:
        - { $ref: "#/components/schemas/SkillProposalInput" }
        - type: object
          required: [id, content_hash, status, version, proposed_by, activated, created_at, updated_at]
          properties:
            id: { type: string, pattern: "^skillproposal_[0-9a-f]{32}$" }
            content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
            status: { type: string, enum: [proposed, approved_inert, rejected] }
            version: { type: integer, minimum: 1 }
            proposed_by: { type: string }
            reviewed_by: { type: string }
            review_reason: { type: string }
            activated: { type: boolean, const: false }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    AutomationRequestInput:
      type: object
      additionalProperties: false
      required: [rationale]
      properties:
        rationale: { type: string, minLength: 1, maxLength: 4096 }
    AutomationRequest:
      type: object
      required: [id, job_id, kind, requested_by, rationale, created_at]
      properties:
        id: { type: string }
        job_id: { type: string }
        kind: { type: string, enum: [review, publication_approval] }
        requested_by: { type: string }
        rationale: { type: string }
        created_at: { type: string, format: date-time }
    JobState:
      type: string
      enum: [queued, syncing, preparing_dependencies, creating_worktree, locking_acceptance_criteria, loading_implementation_model, reproducing, implementing, verifying_targeted, verifying_full, loading_qc_model, qc_review, awaiting_repair, repairing, final_verification, awaiting_operator, publishing_branch, draft_pr_created, completed, failed, cancelled]
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [project_id, repository, task]
      properties:
        project_id: { type: string, minLength: 1, maxLength: 200 }
        repository: { type: string, pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$", maxLength: 200 }
        task: { type: string, minLength: 1, maxLength: 1048576 }
        issue_number: { type: integer, minimum: 1 }
    Job:
      type: object
      required: [id, project_id, repository, task, state, acceptance_criteria, review_cycle, max_wall_seconds, deadline_at, max_tokens, reserved_tokens, version, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        repository: { type: string }
        task: { type: string }
        issue_number: { type: integer }
        state: { $ref: "#/components/schemas/JobState" }
        base_sha: { type: string }
        result_sha: { type: string }
        acceptance_criteria: { type: array, items: { type: object } }
        acceptance_criteria_hash: { type: string }
        review_cycle: { type: integer, minimum: 0 }
        max_wall_seconds: { type: integer, minimum: 60, maximum: 604800 }
        deadline_at: { type: string, format: date-time }
        max_tokens: { type: integer, minimum: 1, maximum: 10000000 }
        reserved_tokens: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Transition:
      type: object
      required: [sequence, job_id, to, actor_id, reason, details, created_at]
      properties:
        sequence: { type: integer, minimum: 1 }
        job_id: { type: string }
        from: { $ref: "#/components/schemas/JobState" }
        to: { $ref: "#/components/schemas/JobState" }
        actor_id: { type: string }
        reason: { type: string }
        details: { type: object }
        created_at: { type: string, format: date-time }
    Artifact:
      type: object
      required: [id, job_id, project_id, sha256, bytes, kind, media_type, producer, metadata, created_at]
      properties:
        id: { type: string, pattern: "^artifact_[0-9a-f]{32}$" }
        job_id: { type: string }
        project_id: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        bytes: { type: integer, minimum: 0 }
        kind: { type: string }
        media_type: { type: string }
        producer: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    Finding:
      type: object
      required: [job_id, id, severity, category, claim, location, required_resolution, verification_method, status, first_seen_cycle, last_seen_cycle, version, created_at, updated_at]
      properties:
        job_id: { type: string }
        id: { type: string }
        severity: { type: string, enum: [blocker, must_fix, should_fix, note] }
        category: { type: string }
        claim: { type: string }
        location: { type: object, additionalProperties: true }
        required_resolution: { type: string }
        verification_method: { type: string }
        status: { type: string, enum: [open, fixed, verified, disputed, accepted, rejected, human_waived, closed] }
        first_seen_cycle: { type: integer, minimum: 0 }
        last_seen_cycle: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Approval:
      type: object
      required: [id, job_id, kind, subject_sha, actor_id, actor_role, rationale, reauthenticated, created_at]
      properties:
        id: { type: string }
        job_id: { type: string }
        kind: { type: string }
        subject_sha: { type: string, pattern: "^[a-f0-9]{40}$" }
        actor_id: { type: string }
        actor_role: { type: string, enum: [reviewer, administrator] }
        rationale: { type: string }
        reauthenticated: { type: boolean }
        created_at: { type: string, format: date-time }
    PhaseRecord:
      type: object
      required: [job_id, phase_state, phase_version, outcome, created_at]
      properties:
        job_id: { type: string }
        phase_state: { $ref: "#/components/schemas/JobState" }
        phase_version: { type: integer, minimum: 1 }
        outcome: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    SystemStatus:
      type: object
      required: [status, profile, uptime_seconds, components]
      properties:
        status: { type: string }
        profile: { type: string }
        uptime_seconds: { type: integer, minimum: 0 }
        components: { type: object, additionalProperties: { type: string } }
    SystemConfig:
      type: object
      additionalProperties: false
      required: [schema_version, deployment, workflow, qc, protected_paths]
      properties:
        schema_version: { type: integer, const: 1 }
        deployment:
          type: object
          additionalProperties: false
          required: [listen_address, data_root, profile]
          properties:
            listen_address: { type: string }
            data_root: { type: string }
            profile: { type: string, enum: [mock, production] }
        workflow:
          type: object
          additionalProperties: false
          required: [max_review_cycles, max_wall_seconds, max_log_bytes]
          properties:
            max_review_cycles: { type: integer, minimum: 1, maximum: 10 }
            max_wall_seconds: { type: integer, minimum: 60 }
            max_log_bytes: { type: integer, minimum: 1024, maximum: 1073741824 }
        qc:
          type: object
          additionalProperties: false
          required: [block_on, require_evidence_for_blocking, require_verification_method, human_waiver_enabled, waiver_rationale_required]
          properties:
            block_on: { type: array, minItems: 1, items: { type: string, enum: [blocker, must_fix, should_fix, note] } }
            require_evidence_for_blocking: { type: boolean }
            require_verification_method: { type: boolean }
            human_waiver_enabled: { type: boolean }
            waiver_rationale_required: { type: boolean }
        protected_paths:
          type: object
          additionalProperties: false
          required: [patterns]
          properties:
            patterns: { type: array, minItems: 1, items: { type: string } }
    ConfigDocumentRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document: { $ref: "#/components/schemas/SystemConfig" }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ValidationResult:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { type: string } }
    ConfigRevision:
      type: object
      required: [id, sequence, actor_id, schema_version, before, after, diff, validation_result, reason, created_at]
      properties:
        id: { type: string }
        sequence: { type: integer, minimum: 1 }
        actor_id: { type: string }
        schema_version: { type: integer, const: 1 }
        before: { type: object, additionalProperties: true }
        after: { $ref: "#/components/schemas/SystemConfig" }
        diff: { type: array, items: { type: object, additionalProperties: true } }
        validation_result: { $ref: "#/components/schemas/ValidationResult" }
        rollback_of: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }
