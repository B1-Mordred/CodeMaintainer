        key: { type: string }
        value: {}
        configured: { type: boolean }
        source_scope: { $ref: "#/components/schemas/ConfigScopeRef" }
        source_revision: { type: string }
        contributions: { type: array, items: { $ref: "#/components/schemas/ConfigContribution" } }
        apply: { type: string, enum: [live, new_jobs, service_reload, operator_restart] }
        secret: { type: boolean }
    EffectiveConfiguration:
      type: object
      additionalProperties: false
      required: [schema_version, scopes, values]
      properties:
        schema_version: { type: integer, const: 1 }
        scopes: { type: array, items: { $ref: "#/components/schemas/ConfigScopeRef" } }
        values: { type: object, additionalProperties: { $ref: "#/components/schemas/ConfigEffectiveValue" } }
    JobConfigSnapshot:
      type: object
      additionalProperties: false
      required: [job_id, schema_version, registry_hash, sha256, document, created_at]
      properties:
        job_id: { type: string }
        schema_version: { type: integer, minimum: 1 }
        registry_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        document:
          type: object
          additionalProperties: true
          description: Complete immutable redacted configuration snapshot with effective-value provenance.
        created_at: { type: string, format: date-time }
    SystemConfig:
      type: object
      additionalProperties: false
      required: [schema_version, deployment, workflow, qc, protected_paths, notifications]
      properties:
        schema_version: { type: integer, const: 1 }
        deployment:
          type: object
          additionalProperties: false
          required: [listen_address, data_root, profile]
          properties:
            listen_address: { type: string }
            data_root: { type: string }
            profile: { type: string, enum: [mock, production] }
        workflow:
          type: object
          additionalProperties: false
          required: [max_review_cycles, max_wall_seconds, max_log_bytes]
          properties:
            max_review_cycles: { type: integer, minimum: 1, maximum: 10 }
            max_wall_seconds: { type: integer, minimum: 60 }
            max_log_bytes: { type: integer, minimum: 1024, maximum: 1073741824 }
        qc:
          type: object
          additionalProperties: false
          required: [block_on, require_evidence_for_blocking, require_verification_method, human_waiver_enabled, waiver_rationale_required]
          properties:
            block_on: { type: array, minItems: 1, items: { type: string, enum: [blocker, must_fix, should_fix, note] } }
            require_evidence_for_blocking: { type: boolean }
            require_verification_method: { type: boolean }
            human_waiver_enabled: { type: boolean }
            waiver_rationale_required: { type: boolean }
        protected_paths:
          type: object
          additionalProperties: false
          required: [patterns]
          properties:
            patterns: { type: array, minItems: 1, items: { type: string } }
        notifications:
          type: object
          additionalProperties: false
          required: [local_inbox_enabled]
          properties:
            local_inbox_enabled: { type: boolean }
    ConfigDocumentRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document: { $ref: "#/components/schemas/SystemConfig" }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ValidationResult:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { type: string } }
    ConfigRevision:
      type: object
      required: [id, sequence, actor_id, schema_version, before, after, diff, validation_result, reason, created_at]
      properties:
        id: { type: string }
        sequence: { type: integer, minimum: 1 }
        actor_id: { type: string }
        schema_version: { type: integer, const: 1 }
        before: { type: object, additionalProperties: true }
        after: { $ref: "#/components/schemas/SystemConfig" }
        diff: { type: array, items: { type: object, additionalProperties: true } }
        validation_result: { $ref: "#/components/schemas/ValidationResult" }
        rollback_of: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }
