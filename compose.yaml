name: codemaintainer

x-runtime-security: &runtime-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  init: true
  restart: unless-stopped

services:
  git-bridge:
    <<: *runtime-security
    image: local/codemaintainer-git-bridge:0.1.0-dev
    build:
      context: .
      dockerfile: images/control-plane.Dockerfile
      target: git-bridge
      args:
        VERSION: 0.1.0-dev
    user: "${MAINTAINER_UID:-1000}:${MAINTAINER_GID:-1000}"
    environment:
      GIT_BRIDGE_DATA_ROOT: /var/lib/maintainer
      GIT_BRIDGE_TOKEN_FILE: /run/secrets/git-bridge.token
      GIT_BRIDGE_WEBHOOK_SECRET_FILE: /run/secrets/github-webhook.secret
    volumes:
      - type: bind
        source: ./.data/mirrors
        target: /var/lib/maintainer/mirrors
      - type: bind
        source: ./.data/worktrees
        target: /var/lib/maintainer/worktrees
      - type: bind
        source: ./.data/remotes
        target: /var/lib/maintainer/remotes
      - type: bind
        source: ./.data/secrets/git-bridge.token
        target: /run/secrets/git-bridge.token
        read_only: true
      - type: bind
        source: ./.data/secrets/github-webhook.secret
        target: /run/secrets/github-webhook.secret
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    networks:
      - control
    mem_limit: 512m
    cpus: 1.0

  model-supervisor:
    <<: *runtime-security
    image: local/codemaintainer-fake-model-server:0.1.0-dev
    build:
      context: .
      dockerfile: images/control-plane.Dockerfile
      target: fake-model-server
      args:
        VERSION: 0.1.0-dev
    user: "${MAINTAINER_UID:-1000}:${MAINTAINER_GID:-1000}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    networks:
      control: {}
      inference:
        aliases:
          - model-supervisor
    mem_limit: 128m
    cpus: 0.5

  runnerd:
    <<: *runtime-security
    image: local/codemaintainer-runnerd:0.1.0-dev
    build:
      context: .
      dockerfile: images/control-plane.Dockerfile
      target: runnerd
      args:
        VERSION: 0.1.0-dev
    user: "${MAINTAINER_UID:-1000}:${MAINTAINER_GID:-1000}"
    environment:
      RUNNERD_DATA_ROOT: /var/lib/maintainer
      RUNNERD_PROFILE: mock
      RUNNERD_SOCKET: /run/maintainer/runnerd.sock
      RUNNERD_TOKEN_FILE: /run/secrets/runnerd.token
    volumes:
      - type: bind
        source: ./.data/worktrees
        target: /var/lib/maintainer/worktrees
      - type: bind
        source: ./.data/artifacts
        target: /var/lib/maintainer/artifacts
      - type: bind
        source: ./.data/caches
        target: /var/lib/maintainer/caches
      - type: bind
        source: ./.data/run
        target: /run/maintainer
      - type: bind
        source: ./.data/secrets/runnerd.token
        target: /run/secrets/runnerd.token
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    network_mode: none
    mem_limit: 256m
    cpus: 1.0

  code-intelligence:
    <<: *runtime-security
    image: local/codemaintainer-code-intelligence:0.1.0-dev
    build:
      context: .
      dockerfile: images/control-plane.Dockerfile
      target: code-intelligence
    user: "65532:65532"
    environment:
      CODE_INTELLIGENCE_LISTEN: 0.0.0.0:8090
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    networks:
      - control
    mem_limit: 512m
    cpus: 1.0

  controller:
    <<: *runtime-security
    image: local/codemaintainer-controller:0.1.0-dev
    build:
      context: .
      dockerfile: images/control-plane.Dockerfile
      target: controller
      args:
        VERSION: 0.1.0-dev
    user: "${MAINTAINER_UID:-1000}:${MAINTAINER_GID:-1000}"
    environment:
      MAINTAINER_DATA_ROOT: /var/lib/maintainer
      MAINTAINER_DATABASE: /var/lib/maintainer/database/controller.db
      MAINTAINER_LISTEN: 0.0.0.0:8080
      MAINTAINER_PROFILE: mock
      MAINTAINER_SECURE_COOKIE: ${MAINTAINER_SECURE_COOKIE:-false}
      MAINTAINER_GIT_BRIDGE_URL: http://git-bridge:8083
      MAINTAINER_CODE_INTELLIGENCE_URL: http://code-intelligence:8090
      MAINTAINER_GIT_BRIDGE_TOKEN_FILE: /var/lib/maintainer/secrets/git-bridge.token
      MAINTAINER_OPENVIKING_URL: ${MAINTAINER_OPENVIKING_URL:-}
      MAINTAINER_OPENVIKING_API_KEY_FILE: /var/lib/maintainer/secrets/openviking.token
      MAINTAINER_OPENVIKING_ACCOUNT: ${MAINTAINER_OPENVIKING_ACCOUNT:-maintainer}
      MAINTAINER_OPENVIKING_USER: ${MAINTAINER_OPENVIKING_USER:-maintainer-controller}
      MAINTAINER_HERMES_TOKEN_FILE: /var/lib/maintainer/secrets/hermes-control.token
    volumes:
      - type: bind
        source: ./.data
        target: /var/lib/maintainer
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - frontend
      - control
      - hermes-control
    depends_on:
      git-bridge:
        condition: service_started
      code-intelligence:
        condition: service_started
    healthcheck:
      test: ["CMD", "/maintainctl", "health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    mem_limit: 1g
    cpus: 2.0

  openviking:
    <<: *runtime-security
    # Official unmodified AGPL-3.0 service, pinned to the Linux/amd64 manifest
    # published for v0.3.21. Its source correspondence is recorded under
    # integrations/openviking and it remains a replaceable network boundary.
    image: ghcr.io/volcengine/openviking:v0.3.21@sha256:1f734afb59463893b765e72f1e19445efd8cfb64d19c2088d7115b917407661a
    user: "${MAINTAINER_UID:-1000}:${MAINTAINER_GID:-1000}"
    environment:
      OPENVIKING_WITH_BOT: "0"
      OPENVIKING_SERVER_HOST: 0.0.0.0
      OPENVIKING_CONFIG_FILE: /app/.openviking/ov.conf
    volumes:
      - type: bind
        source: ./.data/memory/openviking
        target: /app/.openviking
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    networks:
      - control
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1933/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    profiles:
      - memory
    mem_limit: 16g
    cpus: 4.0

  hermes-tool-bridge:
    <<: *runtime-security
    image: local/codemaintainer-hermes-tool-bridge:0.1.0-dev
    build:
      context: .
      dockerfile: images/control-plane.Dockerfile
      target: hermes-tool-bridge
      args:
        VERSION: 0.1.0-dev
    user: "${MAINTAINER_UID:-1000}:${MAINTAINER_GID:-1000}"
    environment:
      HERMES_BRIDGE_CONTROLLER_URL: http://controller:8080
      HERMES_BRIDGE_CONTROLLER_TOKEN_FILE: /run/secrets/hermes-control.token
    volumes:
      - type: bind
        source: ./.data/secrets/hermes-control.token
        target: /run/secrets/hermes-control.token
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    networks:
      - hermes-control
    depends_on:
      controller:
        condition: service_healthy
    profiles:
      - hermes
    mem_limit: 64m
    cpus: 0.25

  hermes:
    <<: *runtime-security
    # Official MIT-licensed image pinned to the Linux/amd64 manifest for
    # v2026.7.7.2. The foreground entrypoint runs as the deployment UID rather
    # than using the image's root initialization path.
    image: nousresearch/hermes-agent:v2026.7.7.2@sha256:3db34ce19adfa080736a2a3feb0316dbcccc588faa9afe7fd8ae1c03b4f1a53a
    user: "${MAINTAINER_UID:-1000}:${MAINTAINER_GID:-1000}"
    entrypoint: ["hermes"]
    command: ["gateway", "run", "--no-supervise"]
    environment:
      HERMES_HOME: /opt/data
    volumes:
      - type: bind
        source: ./.data/hermes
        target: /opt/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
      - /opt/data/home:rw,noexec,nosuid,nodev,size=64m,mode=700
    networks:
      - hermes-control
      - inference
    depends_on:
      hermes-tool-bridge:
        condition: service_started
    profiles:
      - hermes
    mem_limit: 2g
    cpus: 2.0

  maintainctl:
    <<: *runtime-security
    image: local/codemaintainer-cli:0.1.0-dev
    build:
      context: .
      dockerfile: images/control-plane.Dockerfile
      target: maintainctl
      args:
        VERSION: 0.1.0-dev
    user: "${MAINTAINER_UID:-1000}:${MAINTAINER_GID:-1000}"
    environment:
      MAINTAINER_URL: http://controller:8080
      MAINTAINER_SESSION_FILE: /var/lib/maintainctl/session.json
    working_dir: /workspace
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: bind
        source: ./.data/cli
        target: /var/lib/maintainctl
    depends_on:
      controller:
        condition: service_healthy
    networks:
      - control
    profiles:
      - tools
    restart: "no"
    mem_limit: 128m
    cpus: 0.5

  go-tool:
    image: golang:1.25.12-bookworm@sha256:ea341baa9bd5ba6784f6d7161ace70544349a6242d54d34a0fbfd2c4d51c9d58
    user: "${MAINTAINER_UID:-1000}:${MAINTAINER_GID:-1000}"
    working_dir: /src
    command: ["go", "test", "./..."]
    environment:
      GOCACHE: /cache/build
      GOMODCACHE: /cache/mod
      GOPATH: /cache/gopath
    volumes:
      - type: bind
        source: .
        target: /src
      - type: bind
        source: ./.cache/go
        target: /cache
    tmpfs:
      # The Go tool executes test binaries from its work directory and the
      # pure-Go SQLite compiler needs more than 128 MiB. This exception is
      # limited to the developer tool container, never a runtime service.
      - /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: bridge
    profiles:
      - tools
    restart: "no"

  web-tool:
    image: node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059
    user: "${MAINTAINER_UID:-1000}:${MAINTAINER_GID:-1000}"
    working_dir: /src/web
    command: ["npm", "test"]
    environment:
      npm_config_cache: /cache/npm
    volumes:
      - type: bind
        source: .
        target: /src
      - type: bind
        source: ./.cache/npm
        target: /cache/npm
    tmpfs:
      - /src/web/node_modules:rw,exec,nosuid,nodev,size=512m,mode=1777
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: bridge
    profiles:
      - tools
    restart: "no"

  browser-tool:
    image: local/codemaintainer-browser-tool:0.1.0-dev
    build:
      context: .
      dockerfile: images/browser-acceptance.Dockerfile
    user: "${MAINTAINER_UID:-1000}:${MAINTAINER_GID:-1000}"
    working_dir: /src
    environment:
      HOME: /tmp/browser-home
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_OUTPUT_DIR: /src/output/playwright
    volumes:
      - type: bind
        source: .
        target: /src
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: host
    profiles:
      - tools
    restart: "no"

networks:
  # Docker Engine 29 does not activate host port publishing for a container
  # attached only to an internal network. Only the trusted controller joins
  # this ingress network; untrusted workers never do.
  frontend: {}
  control:
    internal: true
  inference:
    internal: true
  hermes-control:
    internal: true
