services:
  remote-proxy:
    profiles: [remote]
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MAINTAINER_REMOTE_HOST: ${MAINTAINER_REMOTE_HOST:?set the authenticated remote hostname}
      OIDC_GATEWAY_URL: ${OIDC_GATEWAY_URL:?set the trusted OIDC or passkey gateway URL}
    ports:
      - target: 8443
        published: ${MAINTAINER_REMOTE_PORT:-8443}
        host_ip: ${MAINTAINER_REMOTE_BIND:-127.0.0.1}
        protocol: tcp
    volumes:
      - type: bind
        source: ./config/caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ${MAINTAINER_TLS_CERT:?set the TLS certificate path}
        target: /run/tls/cert.pem
        read_only: true
      - type: bind
        source: ${MAINTAINER_TLS_KEY:?set the TLS private key path}
        target: /run/tls/key.pem
        read_only: true
    tmpfs: [/config:size=16m,mode=0700,noexec,nosuid,nodev, /data:size=16m,mode=0700,noexec,nosuid,nodev, /tmp:size=16m,mode=1777,noexec,nosuid,nodev]
    networks: [frontend]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
